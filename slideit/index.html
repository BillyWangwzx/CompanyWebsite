<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑了个滑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            line-height: 1.8;
            color: #333;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #fff;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        h1 {
            font-size: 2em;
            color: #1a1a1a;
            margin-bottom: 15px;
        }
        .subtitle {
            color: #666;
            font-size: 0.95em;
        }
        section {
            margin-bottom: 35px;
        }
        h2 {
            font-size: 1.4em;
            color: #1a1a1a;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #0066cc;
        }
        .screenshots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        @media (max-width: 600px) {
            .screenshots {
                grid-template-columns: 1fr;
            }
        }
        .screenshots img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .links a {
            display: inline-block;
            padding: 12px 24px;
            background-color: #0066cc;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1em;
            transition: background-color 0.2s;
        }
        .links a:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>滑了个滑</h1>
            <p class="subtitle">轻松滑动，乐趣无限</p>
        </header>

        <section class="screenshot-section">
            <h2>游戏截图</h2>
            <div class="screenshots">
                <img src="assets/screenshots/screenshot1.jpg" alt="游戏截图 1">
                <img src="assets/screenshots/screenshot2.jpg" alt="游戏截图 2">
                <img src="assets/screenshots/screenshot3.jpg" alt="游戏截图 3">
                <img src="assets/screenshots/screenshot4.jpg" alt="游戏截图 4">
            </div>
        </section>

        <section class="links-section">
            <h2>下载与条款</h2>
            <div class="links">
                <a href="https://l.taptap.cn/10fWd1YZ?channel=rep-rep_2da6qoo1iqy" target="_blank" rel="noopener noreferrer">TapTap</a>
                <a href="https://apps.apple.com/cn/app/%E6%BB%91%E4%BA%86%E4%B8%AA%E6%BB%91/id6758027997r" target="_blank" rel="noopener noreferrer">App Store</a>
                <a href="privacy-policy/">隐私政策</a>
                <a href="term-of-service/">服务条款</a>
            </div>
        </section>
    </div>
</body>
</html>
